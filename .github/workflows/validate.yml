# Runs on every push and PR. Fails if any manifest breaks its schema, lacks a licence, changes an
# approved asset, if catalog/index.json is stale, if media or secrets got into git, or if the
# Remotion project stops compiling. The S3 sha check runs only when an AWS role is configured
# (repo variable AWS_ROLE_ARN, GitHub OIDC; see ARCHITECTURE.md › CI).
name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
  id-token: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: No media or secrets in git
        run: |
          bad=$(git ls-files | grep -iE '\.(mp4|mov|m4v|webm|mp3|wav|m4a|aac|flac|jpe?g|png|webp|gif|heic|psd|blend|ttf|otf|woff2?|zip)$' || true)
          if [ -n "$bad" ]; then echo "Media committed to git (move to S3):"; echo "$bad"; exit 1; fi
          if git grep -nE 'AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9_-]{32,}|sk_[A-Za-z0-9]{32,}|AIza[0-9A-Za-z_-]{35}' -- ':!.githooks' ':!.github' > /dev/null; then echo "A secret-looking string is committed."; exit 1; fi
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Catalog (schemas, licences, ids, ads, index fresh, approved assets unchanged, prompts + inspo links and secrets)
        run: |
          ref=""; git rev-parse -q --verify HEAD~1 >/dev/null && ref="--immutable-against HEAD~1"
          node tools/catalog.ts validate --sha none --check-index $ref
      - name: Remotion compositions list
        run: npx remotion compositions
      - name: AWS credentials (optional)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Manifest sha256 = S3 object sha256
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        run: node tools/catalog.ts validate --sha s3
